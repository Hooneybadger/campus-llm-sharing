# 게이트웨이: 인증·라우팅·요청 제한. /admin 변경 계열은 GW_ADMIN_TOKEN 필요
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: llm-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-system
  labels:
    app: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      serviceAccountName: llm-gateway
      nodeSelector:
        pknu.ac.kr/control-services: 'true'
      containers:
      - name: gateway
        image: registry.example.com/campus-llm-sharing/llm-gateway:0.5.0
        args:
        - --routes
        - /etc/gateway/routes.yaml
        - --keys
        - /etc/gateway-keys/gateway_keys.json
        - --port
        - '8080'
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: '1'    # 단일 프로세스 asyncio — 1코어 이상 못 씀. 2코어 요청은 롤링 업데이트를 막았다 (TS-013)
            memory: 1Gi
          limits:
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: routes
          mountPath: /etc/gateway
        - name: keys
          mountPath: /etc/gateway-keys
          readOnly: true
        - name: models
          mountPath: /models
          readOnly: true
        env:
        - name: GW_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: gw-admin-token
              key: token
      volumes:
      - name: routes
        configMap:
          name: gateway-routes
      - name: keys
        secret:
          secretName: gateway-keys
      - name: models
        hostPath:
          path: /data/llm/models
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: llm-system
  labels:
    app: llm-gateway
spec:
  type: NodePort
  selector:
    app: llm-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
