apiVersion: v1
kind: ServiceAccount
metadata:
  name: rental-manager
  namespace: llm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rental-manager
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rental-manager
subjects:
- kind: ServiceAccount
  name: rental-manager
  namespace: llm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rental-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rental-manager-expansion
  namespace: llm-serving
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rental-manager-expansion
  namespace: llm-serving
subjects:
- kind: ServiceAccount
  name: rental-manager
  namespace: llm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rental-manager-expansion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-manager
  namespace: llm-system
  labels:
    app: rental-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rental-manager
  template:
    metadata:
      labels:
        app: rental-manager
    spec:
      serviceAccountName: rental-manager
      nodeSelector:
        pknu.ac.kr/control-services: 'true'
      containers:
      - name: manager
        image: registry.example.com/campus-llm-sharing/rental-manager:0.3.0
        env:
        - name: GATEWAY_URL
          value: http://llm-gateway.llm-system.svc:8080
        - name: GW_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: gw-admin-token
              key: token
        - name: KEYS_FILE
          value: /etc/gateway-keys/gateway_keys.json
        - name: TZ
          value: Asia/Seoul
        ports:
        - name: http
          containerPort: 8090
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8090
          periodSeconds: 5
        volumeMounts:
        - name: keys
          mountPath: /etc/gateway-keys
          readOnly: true
      volumes:
      - name: keys
        secret:
          secretName: gateway-keys
---
apiVersion: v1
kind: Service
metadata:
  name: rental-manager
  namespace: llm-system
  labels:
    app: rental-manager
spec:
  type: NodePort
  selector:
    app: rental-manager
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    nodePort: 30081
