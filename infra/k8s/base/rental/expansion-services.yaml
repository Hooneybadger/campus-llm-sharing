# 대여 풀 GPU를 추론 확장에 쓸 때의 서비스. 게이트웨이 디스커버리가 본 서비스와 함께 조회한다.
apiVersion: v1
kind: Service
metadata:
  name: serving-small-x
  namespace: llm-serving
  labels:
    app: serving-small-x
    pknu.ac.kr/expansion: 'true'
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: serving-small-x
  ports:
  - name: health
    port: 8000
  - name: qwen3-4b
    port: 8001
  - name: ministral-3b
    port: 8002
  - name: phi4-mini
    port: 8003
---
