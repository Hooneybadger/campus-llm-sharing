# 실습 포털: 모델 실습과 대화 기록·사용량·API 안내, 운영자 현황. 게이트웨이·확장 풀 관리자·Prometheus·Alertmanager를 대신 부른다.
# 대화 기록은 portal-data(PVC)의 SQLite에 사용자별로 둔다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-data
  namespace: llm-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: llm-system
  labels:
    app: portal
spec:
  replicas: 1
  strategy:
    type: Recreate          # PVC(RWO)를 새 Pod가 이어받도록
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      nodeSelector:
        pknu.ac.kr/control-services: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: portal
        image: registry.example.com/campus-llm-sharing/portal:0.3.1
        ports:
        - name: http
          containerPort: 8088
        env:
        - name: PORTAL_DATA
          value: /data
        - name: PUBLIC_API_BASE
          value: http://localhost:30080/v1
        - name: PUBLIC_GRAFANA_URL
          value: http://localhost:30030
        - name: GW_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: gw-admin-token
              key: token
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8088
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8088
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: portal-data
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: llm-system
spec:
  type: NodePort
  selector:
    app: portal
  ports:
  - name: http
    port: 8088
    targetPort: 8088
    nodePort: 30088
