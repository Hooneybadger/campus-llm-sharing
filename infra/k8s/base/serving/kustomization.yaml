apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-serving
resources: [deployments.yaml]
configMapGenerator:
  # 단일 기준 파일(models/)에서 생성 — 빌드 시 --load-restrictor LoadRestrictionsNone 필요 (scripts/deploy.sh)
  - name: model-registry
    files: [registry.yaml=../../../../models/registry.yaml]
  - name: serving-profiles
    files:
      - small3.yaml=../../../../models/profiles/deploy/small3.yaml
      - gptoss.yaml=../../../../models/profiles/deploy/gptoss.yaml
      - qwen30b.yaml=../../../../models/profiles/deploy/qwen30b.yaml
