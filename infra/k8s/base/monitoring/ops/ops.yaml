# GPU Xid exporter: 커널 로그 접근 때문에 privileged — monitoring 네임스페이스(GPU 정책 제외 대상)에서만 운영
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: xid-exporter, namespace: monitoring, labels: {app: xid-exporter}}
spec:
  selector: {matchLabels: {app: xid-exporter}}
  template:
    metadata: {labels: {app: xid-exporter}}
    spec:
      nodeSelector: {nvidia.com/gpu.present: "true"}
      containers:
        - name: exporter
          image: python:3.12-slim
          command: [python, /app/xid_exporter.py]
          env: [{name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}]
          ports: [{name: metrics, containerPort: 9500}]
          securityContext: {privileged: true}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: xid-exporter}}]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: xid-exporter, namespace: monitoring}
spec:
  selector: {matchLabels: {app: xid-exporter}}
  podMetricsEndpoints: [{port: metrics, interval: 10s}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alert-sink, namespace: monitoring, labels: {app: alert-sink}}
spec:
  replicas: 1
  selector: {matchLabels: {app: alert-sink}}
  template:
    metadata: {labels: {app: alert-sink}}
    spec:
      nodeSelector: {pknu.ac.kr/control-services: "true"}
      containers:
        - name: sink
          image: python:3.12-slim
          command: [python, /app/alert_sink.py]
          ports: [{name: http, containerPort: 9095}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: alert-sink}}]
---
apiVersion: v1
kind: Service
metadata: {name: alert-sink, namespace: monitoring}
spec:
  type: NodePort
  selector: {app: alert-sink}
  ports: [{name: http, port: 9095, targetPort: 9095, nodePort: 30095}]
