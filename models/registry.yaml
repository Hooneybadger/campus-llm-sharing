# 모델 레지스트리 — 배포·게이트웨이·에뮬레이터·부하 시험이 모두 이 파일을 기준으로 한다 (P3-1).
# 경로 규약: 노드 로컬 NVMe의 /data/llm/models/<dir> (ADR-005)
# vllm_args는 역할(role)에 무관한 모델 고유 인자만 둔다. 메모리 예산(gpu_memory_utilization,
# max_num_seqs 등)은 배치 프로파일(models/profiles/*.yaml)에서 정한다.
version: 1
vllm_image: vllm/vllm-openai:v0.32.0

models:
  - id: qwen3-4b
    served_name: Qwen3-4B-Instruct-2507
    hf_repo: Qwen/Qwen3-4B-Instruct-2507
    dir: qwen3-4b-instruct-2507
    precision: bf16
    size_class: small
    weights_gb: 8.04
    kv_bytes_per_token: 147456          # 2*36L*8kvh*128hd*2B
    max_position_embeddings: 262144
    vllm_args: ["--enable-auto-tool-choice", "--tool-call-parser", "hermes"]

  - id: ministral-3b
    served_name: Ministral-3-3B-Instruct-2512
    hf_repo: mistralai/Ministral-3-3B-Instruct-2512
    dir: ministral-3-3b-instruct-2512
    precision: fp8
    size_class: small
    weights_gb: 4.67
    kv_bytes_per_token: 106496          # 2*26L*8kvh*128hd*2B
    max_position_embeddings: 262144
    multimodal: true
    # mistral 토크나이저 모드는 API 서버 1개가 스트리밍 디토크나이즈로 CPU 포화 → 고동시성 ITL 6배(TS-018) → API 서버 2개
    vllm_args: ["--tokenizer-mode", "mistral", "--config-format", "mistral", "--load-format", "mistral",
                "--enable-auto-tool-choice", "--tool-call-parser", "mistral", "--api-server-count", "2"]

  - id: phi4-mini
    served_name: Phi-4-mini-instruct
    hf_repo: microsoft/Phi-4-mini-instruct
    dir: phi-4-mini-instruct
    precision: bf16
    size_class: small
    weights_gb: 7.67
    kv_bytes_per_token: 131072          # 2*32L*8kvh*128hd*2B
    max_position_embeddings: 131072
    # HF 기본 템플릿은 OpenAI tools 파라미터를 조용히 무시한다 (TS-005) → vLLM 동봉 템플릿 사용
    vllm_args: ["--enable-auto-tool-choice", "--tool-call-parser", "phi4_mini_json",
                "--chat-template", "/vllm-workspace/examples/tool_chat_template_phi4_mini.jinja"]

  - id: gpt-oss-20b
    served_name: gpt-oss-20b
    hf_repo: openai/gpt-oss-20b
    dir: gpt-oss-20b
    precision: mxfp4
    size_class: large
    weights_gb: 13.76
    kv_bytes_per_token: 49152           # 2*24L*8kvh*64hd*2B (절반은 sliding window 128)
    max_position_embeddings: 131072
    vllm_args: ["--enable-auto-tool-choice", "--tool-call-parser", "openai", "--reasoning-parser", "openai_gptoss"]

  - id: qwen3-30b-a3b
    served_name: Qwen3-30B-A3B-GPTQ-Int4
    hf_repo: Qwen/Qwen3-30B-A3B-GPTQ-Int4
    dir: qwen3-30b-a3b-gptq-int4
    precision: gptq-int4
    size_class: large
    weights_gb: 16.93
    kv_bytes_per_token: 98304           # 2*48L*4kvh*128hd*2B
    max_position_embeddings: 40960
    vllm_args: ["--enable-auto-tool-choice", "--tool-call-parser", "hermes", "--reasoning-parser", "qwen3"]
